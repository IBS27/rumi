name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level high
      - run: bun run typecheck
      - run: bun run typecheck:shared
      - run: bun run lint
      - run: bun test
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Native unit and interface tests
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
          xcodebuild test -project ios/RumiCapture.xcodeproj -scheme RumiCapture -destination "platform=iOS Simulator,id=$simulator_id" CODE_SIGNING_ALLOWED=NO
